<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurelle</title>
<style>
:root{--ink:#1f1a1a;--wine:#7b0f1a;--paper:#f7f6f5;--line:#e2dedb;--mute:#6f6866}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Georgia,serif;color:var(--ink);background:var(--paper)}
header{text-align:center;padding:28px 16px 12px}
h1{margin:0;font-size:2.2rem;letter-spacing:.35em;font-weight:400}
header p{margin:4px 0 0;color:var(--wine);font-style:italic}
nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px 16px}
button,input,select{font:inherit}
button{cursor:pointer;border:0;background:var(--wine);color:#fff;padding:8px 14px;border-radius:4px}
button.ghost{background:none;color:var(--wine);border:1px solid var(--wine)}
button:disabled{background:#b9b3b0;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input,select{padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:#fff}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px;padding:16px;max-width:1100px;margin:auto}
.card .img{aspect-ratio:3/4;display:grid;place-items:center;font-size:2.4rem;color:#fff;letter-spacing:.1em}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.card h3{margin:10px 0 2px;font-size:1rem}.card p{margin:0 0 6px;color:var(--mute);font-size:.85rem}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tag{font-size:.8rem;color:var(--wine)}
aside{position:fixed;top:0;right:0;height:100%;width:min(360px,100%);background:#fff;border-left:1px solid var(--line);padding:16px;transform:translateX(100%);transition:transform .2s;overflow:auto;z-index:5}
aside.open{transform:none}
aside input{width:100%;margin:4px 0}
#chat{position:fixed;right:14px;bottom:14px;width:min(320px,calc(100% - 28px));z-index:4}
#chatbox{display:none;background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
#msgs{height:240px;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.m{padding:6px 10px;border-radius:8px;max-width:85%}.m.u{background:var(--wine);color:#fff;align-self:flex-end}.m.b{background:#f0ece9}
#chatform{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}#chatform input{flex:1;min-width:0}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
</style></head><body>
<header><h1>AURELLE</h1><p>Redefining luxury, one piece at a time</p></header>
<nav>
 <input id="q" placeholder="Search Aurelle" aria-label="Search">
 <select id="cat" aria-label="Collection"><option value="">All collections</option><option>Women Clothing</option><option>Men Clothing</option></select>
 <button class="ghost" id="ordersBtn">Your orders</button>
 <button id="bagBtn">Bag (0)</button>
</nav>
<main id="grid"></main>

<aside id="bag" aria-label="Shopping bag">
 <div class="row"><strong>Your bag</strong><button class="ghost" id="closeBag">Close</button></div>
 <div id="bagItems"></div><p><strong id="total"></strong></p>
 <input id="name" placeholder="Full name"><input id="email" type="email" placeholder="Email">
 <button id="checkout" style="width:100%;margin-top:8px">Place order</button>
 <p id="status" role="status"></p><div id="orders"></div>
</aside>

<div id="chat">
 <div id="chatbox"><div id="msgs"></div>
  <div id="chatform"><input id="cin" placeholder="Ask about shipping, sizes, stock" aria-label="Message Shoppie"><button id="send">Send</button></div></div>
 <button id="chatBtn" style="float:right">Shoppie</button>
</div>

<script>
const $=id=>document.getElementById(id);
const colors=["#7b0f1a","#2f3e46","#8a5a44","#4a4e69","#5f6f52"];
let bag=[],products=[];
const money=n=>"$"+n.toFixed(2);

async function load(){
  const p=new URLSearchParams({q:$("q").value,category:$("cat").value});
  products=await (await fetch("/api/products?"+p)).json();
  const g=$("grid");g.replaceChildren();
  if(!products.length){g.textContent="No products match your search. Try another word or collection.";return}
  products.forEach(x=>{
    const c=document.createElement("div");c.className="card";
    const block=()=>{const d=document.createElement("div");d.className="img";d.style.background=colors[x.id%colors.length];
      d.textContent=x.name.split(" ").slice(0,2).map(w=>w[0]).join("");return d};
    let img=block();
    if(x.image){img=document.createElement("img");img.src="/static/images/"+x.image;img.alt=x.name;img.loading="lazy";
      img.onerror=()=>img.replaceWith(block())}
    const h=document.createElement("h3");h.textContent=x.name;
    const d=document.createElement("p");d.textContent=x.description;
    const r=document.createElement("div");r.className="row";
    const pr=document.createElement("strong");pr.textContent=money(x.price);
    const t=document.createElement("span");t.className="tag";t.textContent=x.stock?x.stock+" left":"Sold out";
    r.append(pr,t);
    const b=document.createElement("button");b.textContent=x.stock?"Add to bag":"Unavailable";b.disabled=!x.stock;
    b.onclick=()=>add(x);
    c.append(img,h,d,r,b);g.append(c);
  });
}
function add(x){
  const i=bag.find(b=>b.id===x.id);
  if(i){if(i.qty<x.stock)i.qty++}else bag.push({id:x.id,name:x.name,price:x.price,qty:1});
  render();$("bag").classList.add("open");
}
function render(){
  $("bagBtn").textContent=`Bag (${bag.reduce((s,b)=>s+b.qty,0)})`;
  const w=$("bagItems");w.replaceChildren();
  bag.forEach(b=>{
    const r=document.createElement("div");r.className="row";
    const s=document.createElement("span");s.textContent=`${b.name} x ${b.qty}`;
    const rm=document.createElement("button");rm.className="ghost";rm.textContent="Remove";
    rm.onclick=()=>{bag=bag.filter(z=>z!==b);render()};
    r.append(s,rm);w.append(r);
  });
  $("total").textContent=bag.length?"Total: "+money(bag.reduce((s,b)=>s+b.price*b.qty,0)):"Your bag is empty. Add a piece to get started.";
}
$("checkout").onclick=async()=>{
  const res=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({customer_name:$("name").value,email:$("email").value,items:bag.map(b=>({product_id:b.id,qty:b.qty}))})});
  const d=await res.json();
  if(res.ok){$("status").textContent=`Order #${d.id} placed. Total ${money(d.total)}.`;bag=[];render();load()}
  else $("status").textContent=typeof d.detail==="string"?d.detail:"Enter your name and email to place the order.";
};
$("ordersBtn").onclick=async()=>{
  const e=$("email").value||prompt("Enter the email you ordered with");if(!e)return;
  $("email").value=e;
  const os=await (await fetch("/api/orders?email="+encodeURIComponent(e))).json();
  $("orders").textContent=os.length?os.map(o=>`Order #${o.id}: ${money(o.total)}`).join(" | "):"No orders found for this email.";
  $("bag").classList.add("open");
};
$("bagBtn").onclick=()=>$("bag").classList.add("open");
$("closeBag").onclick=()=>$("bag").classList.remove("open");
$("q").oninput=load;$("cat").onchange=load;

// Shoppie
function say(t,who){const m=document.createElement("div");m.className="m "+who;m.textContent=t;$("msgs").append(m);$("msgs").scrollTop=1e9}
$("chatBtn").onclick=()=>{const b=$("chatbox");b.style.display=b.style.display==="block"?"none":"block";
  if(!$("msgs").children.length)say("Hi, I'm Shoppie. Ask me about shipping, payment, sizes, prices or stock.","b")};
async function ask(){
  const t=$("cin").value.trim();if(!t)return;$("cin").value="";say(t,"u");
  const r=await (await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:t})})).json();
  say(r.reply,"b");
}
$("send").onclick=ask;$("cin").onkeydown=e=>{if(e.key==="Enter")ask()};
load();render();
</script></body></html>
